version: '3.8'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: jobflow
    ports:
      - "3310:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-service:
    build: ./auth-service
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: jobflow
      JWT_SECRET: 441fa6ac41c5712cf8098bc740ae826aab7c5c01055fcb84efbaa0ceffa1e987c5c76ecb9f0ba70807e5a01d0bbfdc767911e96f2d3ff8dba598f42b4dd0d24c
      PORT: 5000
    depends_on:
      - mysql

  job-service:
    build: ./job-service
    ports:
      - "5001:5001"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: jobflow
      JWT_SECRET: 441fa6ac41c5712cf8098bc740ae826aab7c5c01055fcb84efbaa0ceffa1e987c5c76ecb9f0ba70807e5a01d0bbfdc767911e96f2d3ff8dba598f42b4dd0d24c
      PORT: 5001
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis

  application-service:
    build: ./application-service
    ports:
      - "5002:5002"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: jobflow
      JWT_SECRET: 441fa6ac41c5712cf8098bc740ae826aab7c5c01055fcb84efbaa0ceffa1e987c5c76ecb9f0ba70807e5a01d0bbfdc767911e96f2d3ff8dba598f42b4dd0d24c
      PORT: 5002
      RABBITMQ_HOST: rabbitmq
    restart: on-failure
    depends_on:
      mysql:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: jobflow
      RABBITMQ_HOST: rabbitmq
    restart: on-failure
    depends_on:
      mysql:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:5000
      JOB_SERVICE_URL: http://job-service:5001
      APPLICATION_SERVICE_URL: http://application-service:5002
    depends_on:
      - auth-service
      - job-service
      - application-service

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  mysql-data: