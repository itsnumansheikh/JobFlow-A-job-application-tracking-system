groups:
  - name: jobflow
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"

      - alert: HighErrorRate
        expr: sum by (instance) (rate(http_request_duration_seconds_count{status_code=~"5.."}[2m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is returning 5xx errors"

      - alert: SlowResponses
        expr: histogram_quantile(0.95, sum by (le, instance) (rate(http_request_duration_seconds_bucket{route!="/metrics"}[5m]))) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} p95 latency is above 1s"